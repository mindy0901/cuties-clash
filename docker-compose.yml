# Ba image riêng biệt:
#   db  → PostgreSQL
#   be  → Fastify + Prisma (không chứa frontend)
#   fr  → nginx phục vụ bản build của Vite + chuyển tiếp /api sang be
#
# ── PRODUCTION: dùng image, KHÔNG mount source ────────────────────────────────
#   docker compose up --build -d
#     → mở http://localhost:5190   (fr proxy /api sang be)
#   ⚠️ Sửa code thì PHẢI chạy lại lệnh này — image là bản chụp tại lúc build.
#
# ── DEV: hot reload CẢ frontend lẫn backend ──────────────────────────────────
#   docker compose --profile dev up -d db be-dev vite
#     → mở http://localhost:5190   (Vite HMR) · API ở be-dev (cổng ngoài 8001)
#     Sửa file trong frontend/ hay backend/ → container tự nạp lại, không cần build.
#     ⚠️ ĐỪNG chạy `fr` cùng lúc: `fr` và `vite` tranh nhau cổng 5190.
#
# Chỉ chạy database (khi dev chạy trực tiếp trên máy):  docker compose up -d db

# Cấu hình backend dùng chung cho `be` và `be-dev` — một chỗ, tránh lệch nhau.
x-backend-env: &backend-env
  ENVIRONMENT: production
  # Trỏ vào service `db` trong mạng của compose, không phải localhost.
  DATABASE_URL: postgresql://${POSTGRES_USER:-martial}:${POSTGRES_PASSWORD:-martial}@db:5432/${POSTGRES_DB:-martial_cutie}
  # Bảng do `prisma migrate deploy` trong docker-entrypoint.sh tạo, không tạo lúc khởi động.
  AUTO_CREATE_TABLES: 'false'
  # Gốc của điểm gọi lại OAuth = địa chỉ mà TRÌNH DUYỆT dùng để mở game (cổng của `fr`).
  # Đổi khi triển khai domain thật — và phải đăng ký lại URI ở Google Console:
  #   <BE_PUBLIC_URL>/api/auth/google/callback
  FRONTEND_URL: ${BE_PUBLIC_URL:-http://localhost:5190}
  POST_LOGIN_REDIRECT: ${BE_PUBLIC_URL:-http://localhost:5190}
  # Bật true sau khi chạy sau HTTPS.
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  JWT_SECRET: ${JWT_SECRET:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  AUTO_LOGIN: ${AUTO_LOGIN:-false}
  # Email allowed into the content admin page (/admin). Empty = nobody gets in.
  ADMIN_EMAILS: ${ADMIN_EMAILS:-}

services:
  # ── Cơ sở dữ liệu ─────────────────────────────────────────────────────────
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-martial}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-martial}
      POSTGRES_DB: ${POSTGRES_DB:-martial_cutie}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Mở ra ngoài để dev chạy backend trực tiếp trên máy vẫn kết nối được.
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-martial} -d ${POSTGRES_DB:-martial_cutie}']
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Backend (image): Fastify + Prisma ─────────────────────────────────────
  be:
    build:
      # Ngữ cảnh là gốc repo vì đây là pnpm workspace (lockfile nằm ở gốc).
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: *backend-env
    ports:
      - '${BE_PORT:-8000}:8000'

  # ── Frontend (image): nginx + bản build của Vite ───────────────────────────
  fr:
    build:
      # Ngữ cảnh là gốc repo (pnpm workspace) vì cần lockfile + frontend/package.json.
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - be
    ports:
      # 5190 để khớp redirect URI đã đăng ký với Google. Đổi thì phải đăng ký lại.
      - '${FR_PORT:-5190}:80'

  # ── DEV: backend có watch (profile `dev`) ─────────────────────────────────
  be-dev:
    profiles: ['dev']
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *backend-env
      ENVIRONMENT: development
      # Dev creates missing tables at startup (same as `.env.example`), so a new migration
      # shows up immediately without anyone remembering to run `prisma migrate deploy`.
      AUTO_CREATE_TABLES: 'true'
      # Swap the entrypoint tail for `tsx watch`: editing a file under backend/ restarts the API.
      DEV_WATCH: 'true'
    volumes:
      # Chỉ mount các thư mục SOURCE. ❌ Không mount cả `./backend` rồi che `node_modules`
      # bằng volume: Docker chỉ nạp named volume khi nó RỖNG, nên sau khi thêm gói vào
      # package.json là volume giữ bản cài cũ (đã dính: `nodemon: not found`), và lần cài
      # lại trong container thì pnpm đòi xoá node_modules nhưng không có TTY nên bỏ dở
      # (`ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY`). Mount source thì container dùng
      # nguyên bản cài trong image — thêm gói thì build lại image, đúng như production.
      - ./backend/src:/app/backend/src
      - ./backend/scripts:/app/backend/scripts
      - ./backend/prisma:/app/backend/prisma
    # Gọi qua `sh` để không phụ thuộc bit thực thi của file trên bind mount.
    entrypoint: ['sh', '/app/backend/docker-entrypoint.sh']
    ports:
      # Cổng ngoài 8001 để KHÔNG tranh cổng 8000 với `be` khi cả hai cùng chạy.
      # Vite trong mạng compose gọi thẳng `be-dev:8000`, nên cổng ngoài không quan trọng.
      - '${BE_DEV_PORT:-8001}:8000'

  # ── DEV: frontend có HMR (profile `dev`) ──────────────────────────────────
  vite:
    profiles: ['dev']
    image: node:22-alpine
    working_dir: /app
    command: >
      sh -c "corepack enable &&
             pnpm install --frozen-lockfile --filter frontend... &&
             pnpm --filter frontend dev"
    environment:
      # Gọi thẳng service dev của backend trong mạng compose.
      VITE_API_TARGET: http://be-dev:8000
      # Nghe trên 0.0.0.0 để cổng 5190 của container ra được ngoài (xem vite.config.ts).
      VITE_DEV_HOST: 'true'
      # Bind mount của Windows nhiều khi KHÔNG phát sự kiện filesystem tới container.
      # Bật polling để HMR chắc chắn chạy (đọc trong frontend/vite.config.ts).
      VITE_USE_POLLING: '1'
      CHOKIDAR_USEPOLLING: 'true'
      # Để pnpm tự quyết khi phải cài lại node_modules — không TTY thì nó bỏ dở.
      CI: 'true'
    volumes:
      - .:/app
      # Che node_modules của Windows bằng volume riêng — cùng lý do như `be-dev`.
      - vite-node-modules:/app/node_modules
      - vite-frontend-node-modules:/app/frontend/node_modules
      # Che luôn dist của Windows để container tự dựng bản của nó.
      - vite-frontend-dist:/app/frontend/dist
      # Cache store của pnpm: container là máy mới nên lần đầu phải tải hết gói.
      - vite-pnpm-store:/root/.local/share/pnpm/store
    ports:
      # Mặc định 5190 cho khớp redirect URI OAuth. Đổi thì phải đăng ký lại URI.
      - '${VITE_PORT:-5190}:5190'
    depends_on:
      - be-dev

volumes:
  db-data:
  vite-node-modules:
  vite-frontend-node-modules:
  vite-frontend-dist:
  vite-pnpm-store:
