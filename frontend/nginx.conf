# Cấu hình nginx cho image FRONTEND (fr).
#
# Vai trò: phục vụ bản build tĩnh của Vite + chuyển tiếp /api sang container backend.
# Nhờ proxy, trình duyệt chỉ thấy MỘT origin (cổng của container này), nên cookie
# phiên đăng nhập hoạt động đúng và không cần cấu hình CORS.

# Tên service trong docker-compose.yml. Đổi ở đây nếu đổi tên service.
upstream backend_api {
	server be:8000;
}

# Che phiên bản nginx khỏi header Server.
server_tokens off;

server {
	listen 80;
	listen [::]:80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	# ── Nén ─────────────────────────────────────────────────────────────────
	gzip on;
	gzip_vary on;
	gzip_min_length 1024;
	gzip_types text/plain text/css application/javascript application/json image/svg+xml;

	# ── API ─────────────────────────────────────────────────────────────────
	# Không cache: mọi thứ dưới /api đều là dữ liệu động và phụ thuộc cookie phiên.
	location /api/ {
		proxy_pass http://backend_api;
		proxy_http_version 1.1;

		# Giữ nguyên Host của trình duyệt để backend dựng URL gọi lại OAuth đúng.
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Host $host;

		# Chuyển tiếp cookie hai chiều (cookie phiên là httpOnly).
		proxy_pass_request_headers on;

		# Không tự đổi theo redirect: để trình duyệt nhận 303/307 của backend.
		proxy_redirect off;

		# OAuth có thể chậm khi gọi Google.
		proxy_connect_timeout 10s;
		proxy_send_timeout 60s;
		proxy_read_timeout 60s;
	}

	# Tài nguyên có hash trong tên → cache dài hạn.
	# `expires 1y` một mình đặt cache-control thành "max-age=31536000"; chỉ thị
	# `immutable` phải nằm trong header của chính location này mới có hiệu lực.
	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	# ── SPA ─────────────────────────────────────────────────────────────────
	# Mọi đường dẫn khác trả index.html để phòng chuẩn bị (/), cửa hàng
	# (/cua-hang) và các đường dẫn tương lai đều tải được khi F5 hoặc mở trực tiếp.
	# index.html không được cache, nếu không người dùng giữ bản cũ sau khi deploy.
	location / {
		try_files $uri $uri/ /index.html;
		add_header Cache-Control "no-cache";
	}
}
