# nginx configuration for the FRONTEND image (fr).
#
# Role: serve the static Vite build + forward /api to the backend container.
# Thanks to the proxy, the browser only sees ONE origin (this container's port), so the
# login session cookie works correctly and no CORS configuration is needed.

# Service name in docker-compose.yml. Change it here if the service is renamed.
upstream backend_api {
	server be:8000;
}

# Hide the nginx version from the Server header.
server_tokens off;

server {
	listen 80;
	listen [::]:80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	# ── Compression ─────────────────────────────────────────────────────────
	gzip on;
	gzip_vary on;
	gzip_min_length 1024;
	gzip_types text/plain text/css application/javascript application/json image/svg+xml;

	# ── API ─────────────────────────────────────────────────────────────────
	# No caching: everything under /api is dynamic data that depends on the session cookie.
	location /api/ {
		proxy_pass http://backend_api;
		proxy_http_version 1.1;

		# Admin art uploads send a finished Full-HD PNG (up to 8 MB); nginx defaults to 1 MB, which would
		# reject the request with a 413 before the backend ever sees it.
		client_max_body_size 12m;

		# Keep the browser's Host so the backend builds the correct OAuth callback URL.
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Host $host;

		# Forward cookies in both directions (the session cookie is httpOnly).
		proxy_pass_request_headers on;

		# Do not rewrite redirects: let the browser receive the backend's 303/307.
		proxy_redirect off;

		# OAuth can be slow when calling Google.
		proxy_connect_timeout 10s;
		proxy_send_timeout 60s;
		proxy_read_timeout 60s;
	}

	# Assets with a hash in the name → long-lived cache.
	# `expires 1y` on its own sets cache-control to "max-age=31536000"; the
	# `immutable` only takes effect when it sits in this location's own header.
	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	# ── SPA ─────────────────────────────────────────────────────────────────
	# Every other path returns index.html so the preparation room (/), the shop
	# (/cua-hang) and any future paths can be loaded with F5 or opened directly.
	# index.html must not be cached, otherwise users keep the old build after a deploy.
	location / {
		try_files $uri $uri/ /index.html;
		add_header Cache-Control "no-cache";
	}
}
